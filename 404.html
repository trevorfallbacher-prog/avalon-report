<!doctype html>
<meta charset="utf-8">
<title>Not found</title>
<script>
// GitHub Pages is case-sensitive; fix casing for known site folders
(function(){
  var known=["nash","marpai","vault"];
  var seg=location.pathname.split("/").filter(Boolean)[0]||"";
  if(known.includes(seg.toLowerCase())&&seg!==seg.toLowerCase()){
    location.replace("/"+seg.toLowerCase()+"/");
  }
})();
</script>
<style>body{font-family:-apple-system,"Segoe UI",sans-serif;background:#EEF3F8;color:#1B2C3B;display:flex;min-height:100vh;align-items:center;justify-content:center}</style>
<p>Page not found. <a href="/">Go to the report</a>.</p>
